name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes the site, and so does a daily
# cron.
#
# The cron is not housekeeping. A static site cannot notice that an event has
# passed: `effectiveStatus()` derives "past" from endDate AT BUILD TIME, so a
# site that does not rebuild keeps serving whatever was true at the last build.
# Between 15 and 23 September 2026 - eight days with no push - the live site
# went on advertising Cohort 2 as upcoming, with a waitlist button, a week after
# it had run. A daily rebuild makes the date-derived status self-correcting,
# which is what the code already assumes. Added 13 Oct 2026, eight days before
# the Second Brain Bootcamp; it earns its keep on the days nobody pushes.
on:
  push:
    branches: [main]
  schedule:
    # 03:17 UTC daily. Events end at 17:00 UK, so a day that finishes on Tuesday
    # reads as past by early Wednesday. Off the hour because scheduled runs
    # queued on the hour are the ones GitHub delays.
    - cron: '17 3 * * *'
  workflow_dispatch:

# Pages needs these; the job cannot deploy without them.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same validation the CI workflow runs: content schemas, then the
      # internal link checker, then JSON-LD and per-page SEO. A broken link or
      # an invalid Event block fails here and never reaches the live site.
      - run: npm run build

      # Stamp the artifact with the commit it was built from. The IndexNow job
      # polls this file on the live site and only pings once it matches, so an
      # indexing hint is never sent for a deploy that did not publish. Not in
      # the sitemap and not a page, so it has no SEO footprint.
      - run: echo "${{ github.sha }}" > dist/build.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages regularly sits in `deployment_in_progress` for longer than the
          # action's 10-minute default while still publishing successfully — the
          # status API lags the CDN. Aborting at 10 minutes marked good deploys
          # as failed, which in turn skipped the IndexNow job below. 20 minutes
          # covers the observed lag; a deploy genuinely stuck past that is a real
          # failure worth seeing.
          timeout: 1200000

  # After a publish is CONFIRMED LIVE, tell IndexNow which URLs changed so
  # Bing-family engines (which feed ChatGPT's web answers) re-crawl now rather
  # than on their own schedule. The script maps changed files to page URLs and
  # falls back to the live sitemap for template-wide changes.
  # continue-on-error: an indexing hint must never redden a deploy.
  #
  # Gate history. `needs: deploy` alone silently skipped this job whenever the
  # deploy status poll timed out on a deploy that had in fact published, so the
  # job was changed to run on build success. That pinged even after a genuinely
  # failed deploy. Since 13 Sept 2026 it runs on build success but pings ONLY
  # once https://oxfordagentic.com/build.txt serves this commit's SHA: a
  # timed-out-but-published deploy still gets its ping, a failed one does not.
  # If a later push supersedes this one before it is seen live, this job logs
  # that and skips; the later push pings its own changes.
  #
  # Push only. A scheduled or manual rebuild has no new commit, so the diff
  # below would resolve to the LAST push's files and hint at them again every
  # day. Nothing changed on those runs, so there is nothing to tell IndexNow.
  indexnow:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits of history, enough to diff the pushed change.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm this commit is live
        id: live
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            LIVE=$(curl -sf -H 'Cache-Control: no-cache' "https://oxfordagentic.com/build.txt?t=$(date +%s)" | tr -d '[:space:]')
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "live build matches ${{ github.sha }}"
              echo "confirmed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $i: live build is '${LIVE:-none}', waiting"
            sleep 30
          done
          echo "deploy not confirmed live after 15 minutes; not pinging IndexNow"
          echo "confirmed=false" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow with changed URLs
        if: ${{ steps.live.outputs.confirmed == 'true' }}
        continue-on-error: true
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          node scripts/indexnow-ping.mjs $CHANGED
