name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes the site. Nothing else to run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the job cannot deploy without them.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same validation the CI workflow runs: content schemas, then the
      # internal link checker, then JSON-LD and per-page SEO. A broken link or
      # an invalid Event block fails here and never reaches the live site.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages regularly sits in `deployment_in_progress` for longer than the
          # action's 10-minute default while still publishing successfully — the
          # status API lags the CDN. Aborting at 10 minutes marked good deploys
          # as failed, which in turn skipped the IndexNow job below. 20 minutes
          # covers the observed lag; a deploy genuinely stuck past that is a real
          # failure worth seeing.
          timeout: 1200000

  # After a successful publish, tell IndexNow which URLs changed so Bing-family
  # engines (which feed ChatGPT's web answers) re-crawl now rather than on
  # their own schedule. The script maps changed files to page URLs and falls
  # back to the live sitemap for template-wide changes — no rebuild needed.
  # continue-on-error: an indexing hint must never redden a deploy.
  #
  # The gate is `build` succeeding, not `deploy` succeeding. `needs: deploy`
  # alone silently skipped this job every time the deploy status poll timed out
  # on a deploy that had in fact published — so the ping stopped happening
  # exactly when it was needed. The worst case in the other direction is a
  # redundant ping after a genuinely failed deploy, which costs nothing: the
  # crawler re-reads a page that has not changed.
  indexnow:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits of history, enough to diff the pushed change.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping IndexNow with changed URLs
        continue-on-error: true
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          node scripts/indexnow-ping.mjs $CHANGED
